<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="StockWise architecture: Streamlit UI, ctypes bridge, C engine modules and SQLite">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52525b"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14171f" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: Inter, 'Segoe UI', system-ui, sans-serif; }
      .t { font-size: 16px; font-weight: 650; fill: #14171f; }
      .s { font-size: 13px; fill: #52525b; }
      .l { font-size: 12.5px; fill: #52525b; font-weight: 500; }
      .chip-t { font-size: 13px; font-weight: 650; fill: #14171f; }
      .chip-s { font-size: 12px; fill: #52525b; }
      .box { fill: #ffffff; stroke: #e1e4ea; stroke-width: 1.5; }
      .line { stroke: #52525b; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="1000" height="600" fill="#f7f8fa" rx="16"/>

  <!-- Streamlit UI -->
  <g filter="url(#sh)"><rect class="box" x="360" y="24" width="280" height="76" rx="12"/></g>
  <rect x="360" y="24" width="6" height="76" rx="3" fill="#2a78d6"/>
  <text class="t" x="384" y="56">Streamlit UI</text>
  <text class="s" x="384" y="80">app.py · 7 pages · Plotly charts</text>

  <!-- SQLite -->
  <g filter="url(#sh)"><rect class="box" x="40" y="176" width="250" height="76" rx="12"/></g>
  <g transform="translate(62 194)" fill="none" stroke="#1baf7a" stroke-width="2">
    <ellipse cx="14" cy="6" rx="14" ry="5"/>
    <path d="M0 6 v28 c0 3 6 5 14 5 s14-2 14-5 v-28"/>
    <path d="M0 20 c0 3 6 5 14 5 s14-2 14-5"/>
  </g>
  <text class="t" x="104" y="208">SQLite database</text>
  <text class="s" x="104" y="232">database.py · stockwise.db</text>

  <!-- Bridge -->
  <g filter="url(#sh)"><rect class="box" x="360" y="176" width="280" height="76" rx="12"/></g>
  <rect x="360" y="176" width="6" height="76" rx="3" fill="#eb6834"/>
  <text class="t" x="384" y="208">c_bridge.py</text>
  <text class="s" x="384" y="232">input validation · ctypes structs</text>

  <!-- note -->
  <rect x="710" y="176" width="250" height="76" rx="12" fill="none" stroke="#86b6ef" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="l" x="730" y="208">Rebuilt from SQLite on every</text>
  <text class="l" x="730" y="228">page load, so indexes are never stale</text>

  <!-- C engine container -->
  <rect x="110" y="328" width="780" height="248" rx="16" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.5"/>
  <text class="t" x="134" y="362">libstockwise · C11 shared library</text>
  <text class="s" x="134" y="384">10 modules · error codes · caller-owned buffers</text>
  <g filter="url(#sh)">
    <rect class="box" x="134" y="404" width="136" height="70" rx="10"/>
    <rect class="box" x="282" y="404" width="136" height="70" rx="10"/>
    <rect class="box" x="430" y="404" width="136" height="70" rx="10"/>
    <rect class="box" x="578" y="404" width="136" height="70" rx="10"/>
    <rect class="box" x="726" y="404" width="136" height="70" rx="10"/>
    <rect class="box" x="134" y="486" width="136" height="70" rx="10"/>
    <rect class="box" x="282" y="486" width="136" height="70" rx="10"/>
    <rect class="box" x="430" y="486" width="136" height="70" rx="10"/>
    <rect class="box" x="578" y="486" width="136" height="70" rx="10"/>
    <rect class="box" x="726" y="486" width="136" height="70" rx="10"/>
  </g>
  <text class="chip-t" x="148" y="434">search.c</text>
  <text class="chip-s" x="148" y="455">linear · binary</text>
  <text class="chip-t" x="296" y="434">hash_table.c</text>
  <text class="chip-s" x="296" y="455">separate chaining</text>
  <text class="chip-t" x="444" y="434">sorting.c</text>
  <text class="chip-s" x="444" y="455">4 sort algorithms</text>
  <text class="chip-t" x="592" y="434">max_heap.c</text>
  <text class="chip-s" x="592" y="455">priority queue</text>
  <text class="chip-t" x="740" y="434">avl_tree.c</text>
  <text class="chip-s" x="740" y="455">price range BST</text>
  <text class="chip-t" x="148" y="516">trie.c</text>
  <text class="chip-s" x="148" y="537">name prefixes</text>
  <text class="chip-t" x="296" y="516">knapsack.c</text>
  <text class="chip-s" x="296" y="537">budget DP</text>
  <text class="chip-t" x="444" y="516">graph.c</text>
  <text class="chip-s" x="444" y="537">Dijkstra routes</text>
  <text class="chip-t" x="592" y="516">fifo_queue.c</text>
  <text class="chip-s" x="592" y="537">circular queue</text>
  <text class="chip-t" x="740" y="516">inventory_engine.c</text>
  <text class="chip-s" x="740" y="537">public API</text>

  <!-- UI -> bridge -->
  <path class="line" d="M500 100 V172" marker-end="url(#arrow)"/>
  <text class="l" x="512" y="142">product dicts</text>

  <!-- bridge <-> engine -->
  <path class="line" d="M460 252 V324" marker-end="url(#arrow)"/>
  <text class="l" x="306" y="294">Product[] via ctypes</text>
  <path class="line" d="M540 328 V256" marker-end="url(#arrow)"/>
  <text class="l" x="552" y="294">indices · counts · error codes</text>

  <!-- SQLite <-> UI -->
  <path class="line" d="M165 176 V62 H356" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="l" x="182" y="52">CRUD · stock IN/OUT</text>
  <text class="l" x="182" y="82">list_products()</text>
</svg>
