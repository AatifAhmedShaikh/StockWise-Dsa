<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="StockWise inventory overview banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d366b"/>
      <stop offset="0.6" stop-color="#1c5cab"/>
      <stop offset="1" stop-color="#2a78d6"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.10"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1f3d" flood-opacity="0.35"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="240" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <rect x="640" width="560" height="240" fill="url(#dots)"/>
    <circle cx="1130" cy="-30" r="170" fill="#ffffff" opacity="0.05"/>
    <circle cx="700" cy="300" r="140" fill="#ffffff" opacity="0.04"/>

    <!-- copy -->
    <text x="56" y="74" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="2.2" fill="#9ec5f4">INVENTORY OPTIMIZATION SYSTEM</text>
    <text x="56" y="122" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="-0.6">Know what to restock,</text>
    <text x="56" y="164" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="-0.6">before it runs out.</text>
    <text x="56" y="200" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#cde2fb">Hashing, trees, tries, heaps, graphs and dynamic programming, built in C.</text>

    <!-- shelving unit -->
    <g opacity="0.95">
      <rect x="720" y="44" width="8" height="196" rx="3" fill="#86b6ef" opacity="0.55"/>
      <rect x="1004" y="44" width="8" height="196" rx="3" fill="#86b6ef" opacity="0.55"/>
      <rect x="712" y="128" width="308" height="7" rx="3" fill="#cde2fb" opacity="0.7"/>
      <rect x="712" y="222" width="308" height="7" rx="3" fill="#cde2fb" opacity="0.7"/>
    </g>

    <!-- upper shelf boxes -->
    <g>
      <rect x="744" y="78" width="62" height="50" rx="5" fill="#ffffff"/>
      <rect x="744" y="78" width="62" height="12" rx="5" fill="#e6eef9"/>
      <rect x="771" y="78" width="8" height="50" fill="#b7d3f6"/>
      <rect x="814" y="92" width="46" height="36" rx="5" fill="#eb6834"/>
      <rect x="814" y="92" width="46" height="9" rx="4" fill="#d95926"/>
      <rect x="868" y="70" width="54" height="58" rx="5" fill="#ffffff" opacity="0.9"/>
      <rect x="868" y="70" width="54" height="12" rx="5" fill="#e6eef9"/>
      <rect x="891" y="70" width="8" height="58" fill="#b7d3f6"/>
    </g>

    <!-- lower shelf boxes -->
    <g>
      <rect x="742" y="160" width="74" height="62" rx="5" fill="#ffffff"/>
      <rect x="742" y="160" width="74" height="13" rx="5" fill="#e6eef9"/>
      <rect x="774" y="160" width="9" height="62" fill="#b7d3f6"/>
      <rect x="824" y="146" width="66" height="76" rx="5" fill="#1baf7a"/>
      <rect x="824" y="146" width="66" height="13" rx="5" fill="#199e70"/>
      <rect x="853" y="146" width="9" height="76" fill="#ffffff" opacity="0.35"/>
      <rect x="898" y="182" width="52" height="40" rx="5" fill="#ffffff" opacity="0.9"/>
      <rect x="918" y="182" width="8" height="40" fill="#b7d3f6"/>
      <!-- empty slot: dashed outline signals a product to restock -->
      <rect x="958" y="176" width="40" height="46" rx="5" fill="none" stroke="#cde2fb" stroke-width="2" stroke-dasharray="5 4"/>
    </g>

    <!-- floating analytics card -->
    <g filter="url(#shadow)">
      <rect x="958" y="34" width="190" height="122" rx="14" fill="#ffffff"/>
    </g>
    <text x="976" y="60" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#52525b">Restock priority</text>
    <rect x="976" y="72" width="132" height="8" rx="4" fill="#eef1f5"/>
    <rect x="976" y="72" width="118" height="8" rx="4" fill="#2a78d6"/>
    <rect x="976" y="90" width="132" height="8" rx="4" fill="#eef1f5"/>
    <rect x="976" y="90" width="92" height="8" rx="4" fill="#2a78d6" opacity="0.8"/>
    <rect x="976" y="108" width="132" height="8" rx="4" fill="#eef1f5"/>
    <rect x="976" y="108" width="64" height="8" rx="4" fill="#2a78d6" opacity="0.6"/>
    <rect x="976" y="126" width="132" height="8" rx="4" fill="#eef1f5"/>
    <rect x="976" y="126" width="40" height="8" rx="4" fill="#2a78d6" opacity="0.4"/>
    <circle cx="1128" cy="76" r="5" fill="#d03b3b"/>
    <circle cx="1128" cy="94" r="5" fill="#ec835a"/>
    <circle cx="1128" cy="112" r="5" fill="#fab219"/>
    <circle cx="1128" cy="130" r="5" fill="#0ca30c"/>
  </g>
</svg>
